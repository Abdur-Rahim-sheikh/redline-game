<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../styles.css" />
    <title>KAK URAAN visual test</title>
  </head>
  <body>
    <main class="app-shell">
      <canvas id="game"></canvas>
      <div hidden>
        <span id="score"></span>
        <span id="hud-best"></span>
        <button id="sound-button"></button>
        <span id="message"></span>
      </div>
    </main>
    <script type="module">
      const byId = (id) => document.getElementById(id);
      const { CrowFlightGame } = await import("../src/game.js");
      const game = new CrowFlightGame(byId("game"), {
        score: byId("score"),
        hudBest: byId("hud-best"),
        soundButton: byId("sound-button"),
        message: byId("message"),
      });
      await game.ready;
      game.start();
      await new Promise((resolve) => globalThis.setTimeout(resolve, 1000));
    </script>
  </body>
</html>
